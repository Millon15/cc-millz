name: tests

on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        # The plugins target macOS (agterm, launchd, plutil, lockf) and the suites call BSD stat, date and sed.
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install bats-core and ripgrep
              run: brew install bats-core ripgrep

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            # Discovery sets run as separate steps so the log says which kind
            # went red, and either one failing fails the job.
            - name: Shared source drift
              run: make test-generated

            - name: Python protocol and packaging suites
              run: make test-python

            - name: bats suites
              run: make test-bats

            - name: TypeScript suites
              run: make test-ts
